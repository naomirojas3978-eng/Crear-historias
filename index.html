<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creador de historias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#221B2E; --panel:#2A2338; --line:#3A3049; --paper:#F3E9D2;
    --text:#F3E9D2; --muted:#B8ABCB; --dim:#7A6A45; --gold:#D3A625;
    --thread:#A23B3B; --teal:#4F7C82; --cork:#C9A66B; --corkBorder:#6B4A2A;
  }
  * { box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--ink); color:var(--text);
    font-family:'Spectral', Georgia, serif;
    min-height:100vh;
  }
  input, textarea, select, button { font-family:inherit; }
  ::selection{ background:var(--gold); color:var(--ink); }
  input:focus, textarea:focus, select:focus, button:focus-visible{
    outline:2px solid var(--gold); outline-offset:2px;
  }
  button{ cursor:pointer; }

  /* ---------- barra superior ---------- */
  #topbar{ position:sticky; top:0; z-index:20; background:#1B1524; border-bottom:1px solid var(--line); }
  .topbar-inner{ max-width:960px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:6px; min-width:0; }
  .back-btn{ display:flex; align-items:center; gap:4px; background:transparent; border:none; color:var(--text); padding:0; }
  .brand-text{ font-family:'Fraunces', serif; font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:180px; }
  .tab-row{ display:flex; gap:6px; margin-left:auto; }
  .tab-btn{ display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; border:1px solid transparent; background:transparent; color:var(--muted); font-size:12.5px; font-family:'Space Mono', monospace; }
  .tab-btn.active{ background:var(--gold); color:var(--ink); font-weight:700; }
  .pdf-btn{ display:flex; align-items:center; gap:6px; background:transparent; border:1px solid var(--teal); color:var(--teal); border-radius:999px; padding:7px 12px; font-size:11.5px; font-family:'Space Mono', monospace; font-weight:700; }
  .save-indicator{ display:flex; align-items:center; gap:5px; font-family:'Space Mono', monospace; font-size:10.5px; color:var(--dim); }

  main{ max-width:960px; margin:0 auto; padding:24px 16px 64px; }
  .page-wrap{ display:flex; flex-direction:column; gap:22px; }
  .label{ font-family:'Space Mono', monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; display:block; }
  .muted{ font-size:12px; color:var(--dim); margin:2px 0 8px; }

  /* ---------- biblioteca ---------- */
  .section-heading{ font-family:'Fraunces', serif; font-size:22px; margin:0; }
  .board-header{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .library-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:22px; }
  .add-book{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; height:190px; border-radius:4px; border:1px dashed var(--teal); color:var(--teal); font-family:'Space Mono', monospace; font-size:11.5px; background:transparent; }
  .book-card{ position:relative; display:flex; flex-direction:column; gap:8px; }
  .book-cover{ height:190px; border-radius:4px; box-shadow:0 8px 18px rgba(0,0,0,.35); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; background-size:cover; background-position:center; }
  .book-title{ font-family:'Fraunces', serif; font-size:13.5px; font-weight:600; line-height:1.3; }
  .delete-badge{ position:absolute; top:6px; right:6px; background:rgba(34,27,46,.75); border:none; border-radius:50%; width:24px; height:24px; display:flex; align-items:center; justify-content:center; color:var(--text); }
  .confirm-row{ display:flex; gap:6px; }
  .confirm-yes{ background:var(--thread); color:var(--text); border:none; border-radius:6px; padding:5px 8px; font-family:'Space Mono', monospace; font-size:10.5px; }
  .confirm-no{ background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-family:'Space Mono', monospace; font-size:10.5px; }

  /* ---------- portada ---------- */
  .cover-layout{ display:flex; gap:24px; flex-wrap:wrap; }
  .cover-art{ width:190px; height:260px; border-radius:4px; box-shadow:0 10px 24px rgba(0,0,0,.4); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex-shrink:0; background-size:cover; background-position:center; }
  .cover-art-empty{ display:flex; flex-direction:column; align-items:center; gap:8px; color:rgba(34,27,46,.55); font-size:12px; font-family:'Space Mono', monospace; text-align:center; padding:12px; }
  .swatch-row{ display:flex; gap:8px; }
  .swatch{ width:22px; height:22px; border-radius:50%; border:none; }
  .cover-fields{ flex:1; min-width:220px; display:flex; flex-direction:column; gap:6px; }
  .title-input{ font-family:'Fraunces', serif; font-size:30px; font-weight:600; background:transparent; border:none; border-bottom:1px solid var(--line); color:var(--text); padding:4px 0; margin-bottom:12px; width:100%; }
  .tagline-input{ background:transparent; border:none; border-bottom:1px solid var(--line); color:var(--muted); font-size:14px; font-style:italic; padding:4px 0; margin-bottom:18px; width:100%; }
  .primary-btn{ display:inline-flex; align-items:center; gap:8px; align-self:flex-start; background:var(--gold); color:var(--ink); border:none; border-radius:999px; padding:10px 18px; font-family:'Space Mono', monospace; font-size:12.5px; font-weight:700; }
  .primary-btn-sm{ display:inline-flex; align-items:center; gap:6px; background:var(--gold); color:var(--ink); border:none; border-radius:999px; padding:8px 14px; font-family:'Space Mono', monospace; font-size:11.5px; font-weight:700; }
  .secondary-btn-sm{ display:inline-flex; align-items:center; gap:6px; background:transparent; color:var(--teal); border:1px dashed var(--teal); border-radius:999px; padding:7px 12px; font-family:'Space Mono', monospace; font-size:11.5px; font-weight:700; margin-top:8px; }
  .ghost-btn{ background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:10px 16px; font-family:'Space Mono', monospace; font-size:12px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; }
  .card-title{ font-family:'Fraunces', serif; font-size:17px; margin:0 0 10px; }
  .synopsis-area{ width:100%; min-height:110px; background:transparent; border:none; color:#D9CEEA; font-size:14.5px; line-height:1.6; resize:vertical; }

  /* ---------- corcho de personajes ---------- */
  .cork-board{ position:relative; background:
      radial-gradient(circle at 20% 20%, rgba(0,0,0,.06) 0, rgba(0,0,0,.06) 2px, transparent 2px),
      radial-gradient(circle at 60% 70%, rgba(0,0,0,.05) 0, rgba(0,0,0,.05) 2px, transparent 2px),
      var(--cork); background-size:26px 26px,34px 34px,auto; border:10px solid var(--corkBorder); border-radius:6px; padding:22px; min-height:220px; }
  .thread-svg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .thread-label{ font-family:'Space Mono', monospace; font-size:9.5px; text-align:center; background:var(--paper); color:#241C1C; border-radius:4px; padding:1px 4px; border:1px solid var(--thread); line-height:16px; }
  .empty-board{ text-align:center; padding:24px 0; color:#7A6A45; }
  .board-grid{ position:relative; display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:20px; }
  .pin-card{ position:relative; background:var(--paper); border-radius:3px; padding:18px 10px 10px; text-align:center; box-shadow:0 6px 12px rgba(0,0,0,.25); transform:rotate(-1deg); border:none; }
  .pin{ position:absolute; top:-6px; left:50%; transform:translateX(-50%); width:11px; height:11px; border-radius:50%; background:var(--gold); box-shadow:0 2px 3px rgba(0,0,0,.4); }
  .pin-photo{ width:56px; height:56px; border-radius:50%; margin:0 auto 8px; display:flex; align-items:center; justify-content:center; border:2px solid var(--corkBorder); background-size:cover; background-position:center; background-color:#DDCBA0; }
  .pin-name{ font-family:'Fraunces', serif; font-size:13.5px; color:#241C1C; font-weight:600; }
  .pin-role{ font-family:'Space Mono', monospace; font-size:9.5px; color:#7A6A45; margin-top:2px; }

  /* ---------- editor de personaje (panel) ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(15,11,20,.72); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .editor-panel{ background:var(--panel); width:100%; max-width:480px; max-height:92vh; border-radius:16px 16px 0 0; display:flex; flex-direction:column; border:1px solid var(--line); border-bottom:none; }
  .editor-header{ display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); }
  .editor-title{ font-family:'Fraunces', serif; font-size:15px; font-weight:600; flex:1; }
  .icon-btn{ background:transparent; border:none; color:var(--muted); padding:4px; }
  .icon-btn-danger{ background:transparent; border:none; color:#C77373; padding:4px; }
  .editor-body{ padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; }
  .editor-top-row{ display:flex; gap:14px; margin-bottom:14px; }
  .editor-photo{ width:64px; height:64px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; border:2px solid var(--line); background-size:cover; background-position:center; background-color:#DDCBA0; }
  .field-input{ width:100%; background:#1F1930; border:1px solid var(--line); border-radius:6px; padding:8px 10px; color:var(--text); font-size:13.5px; }
  .field-select{ background:#1F1930; border:1px solid var(--line); border-radius:6px; padding:8px 6px; color:var(--text); font-size:12.5px; max-width:110px; }
  .textarea-sm{ width:100%; min-height:60px; background:#1F1930; border:1px solid var(--line); border-radius:6px; padding:9px 10px; color:var(--text); font-size:13.5px; margin-bottom:14px; resize:vertical; }
  .textarea-lg{ width:100%; min-height:110px; background:#1F1930; border:1px solid var(--line); border-radius:6px; padding:9px 10px; color:var(--text); font-size:13.5px; resize:vertical; }
  .relations-box{ background:#1F1930; border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:14px; }
  .relation-row{ display:flex; gap:6px; align-items:center; margin-bottom:8px; }
  .editor-footer{ display:flex; gap:10px; justify-content:flex-end; padding:12px 16px; border-top:1px solid var(--line); }
  .two-col{ display:flex; gap:10px; margin-top:10px; }

  /* ---------- historia ---------- */
  .word-count{ font-family:'Space Mono', monospace; font-size:11.5px; color:var(--dim); }
  .manuscript-card{ background:var(--paper); border-radius:4px; padding:26px 24px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .manuscript-area{ width:100%; min-height:58vh; background:transparent; border:none; color:#241C1C; font-family:'Spectral', Georgia, serif; font-size:16.5px; line-height:1.85; resize:vertical; }

  @media (max-width:640px){
    .board-grid{ grid-template-columns:repeat(2,1fr) !important; }
    .library-grid{ grid-template-columns:repeat(2,1fr) !important; }
  }
</style>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#221B2E" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Historias" />
</head>
<body>
<div id="topbar"></div>
<main id="main"></main>
<div id="modal-root"></div>

<script>
/* ============ utilidades ============ */
const uid = () => Math.random().toString(36).slice(2, 10);
const RELATION_PRESETS = ["Hermano/a", "Amigo/a", "Familia", "Rival", "Mentor/a", "Pareja"];
const COVER_SWATCHES = ["#D3A625", "#A23B3B", "#4F7C82", "#6B4C9A", "#3E5C3E"];

const emptyStory = () => ({ title:"", tagline:"", cover:null, coverColor:COVER_SWATCHES[0], synopsis:"", manuscript:"" });
const emptyCharacter = () => ({ id:uid(), name:"", age:"", role:"", photo:null, appearance:"", description:"", relations:[] });

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

/* ============ almacenamiento local ============ */
const Store = {
  getIndex(){ try{ return JSON.parse(localStorage.getItem("story-index") || "[]"); } catch(e){ return []; } },
  saveIndex(idx){ try{ localStorage.setItem("story-index", JSON.stringify(idx)); } catch(e){} },
  getStory(id){ try{ return JSON.parse(localStorage.getItem("story:"+id) || "null"); } catch(e){ return null; } },
  saveStory(id, data){ try{ localStorage.setItem("story:"+id, JSON.stringify(data)); return true; } catch(e){ return false; } },
  deleteStory(id){ try{ localStorage.removeItem("story:"+id); } catch(e){} },
};

/* ============ estado ============ */
const state = {
  view: "library",        // 'library' | 'editor'
  stories: Store.getIndex(),
  currentId: null,
  story: emptyStory(),
  characters: [],
  tab: "portada",
  editingChar: null,       // objeto en edición o null
  isNewChar: false,
  saveState: "saved",
  confirmDeleteId: null,
};
let saveTimer = null;

function scheduleSave(){
  state.saveState = "saving";
  updateSaveIndicator();
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!state.currentId) return;
    const ok = Store.saveStory(state.currentId, { story: state.story, characters: state.characters });
    state.saveState = ok ? "saved" : "idle";
    updateSaveIndicator();
    state.stories = state.stories.map((s) =>
      s.id === state.currentId
        ? { ...s, title: state.story.title, tagline: state.story.tagline, cover: state.story.cover, coverColor: state.story.coverColor, updatedAt: Date.now() }
        : s
    );
    Store.saveIndex(state.stories);
  }, 500);
}
function updateSaveIndicator(){
  const el = document.getElementById("save-indicator-text");
  if (el) el.textContent = state.saveState === "saving" ? "Guardando…" : "Guardado";
}

/* ============ iconos (SVG mínimos) ============ */
const ic = {
  plus:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  trash:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  back:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  image:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>',
  users:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  book:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  save:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>',
  pen:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  download:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>',
  sparkle:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D3A625" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>',
  x:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
};

/* ============ acciones ============ */
function openStory(id){
  const data = Store.getStory(id) || {};
  state.story = { ...emptyStory(), ...(data.story || {}) };
  state.characters = Array.isArray(data.characters) ? data.characters : [];
  state.currentId = id;
  state.tab = "portada";
  state.view = "editor";
  render();
}
function createStory(){
  const id = uid();
  const fresh = emptyStory();
  state.story = fresh;
  state.characters = [];
  state.currentId = id;
  state.tab = "portada";
  state.view = "editor";
  state.stories = [{ id, title:"", tagline:"", cover:null, coverColor: fresh.coverColor, updatedAt: Date.now() }, ...state.stories];
  Store.saveIndex(state.stories);
  Store.saveStory(id, { story: fresh, characters: [] });
  render();
}
function deleteStory(id){
  state.stories = state.stories.filter((s) => s.id !== id);
  Store.saveIndex(state.stories);
  Store.deleteStory(id);
  if (state.currentId === id){ state.view = "library"; state.currentId = null; }
  state.confirmDeleteId = null;
  render();
}
function backToLibrary(){
  state.view = "library";
  state.currentId = null;
  state.editingChar = null;
  render();
}
function setTab(tab){ state.tab = tab; render(); }

function openCharacterEditor(char, isNew){
  state.editingChar = JSON.parse(JSON.stringify(char));
  state.isNewChar = isNew;
  renderModal();
}
function closeCharacterEditor(){ state.editingChar = null; renderModal(); }
function saveCharacterFromEditor(){
  const draft = state.editingChar;
  if (!draft.name.trim()) return;
  const exists = state.characters.some((c) => c.id === draft.id);
  state.characters = exists ? state.characters.map((c) => (c.id === draft.id ? draft : c)) : [...state.characters, draft];
  state.editingChar = null;
  scheduleSave();
  render();
}
function deleteCharacterFromEditor(id){
  state.characters = state.characters.filter((c) => c.id !== id)
    .map((c) => ({ ...c, relations: c.relations.filter((r) => r.targetId !== id) }));
  state.editingChar = null;
  scheduleSave();
  render();
}

/* ============ render principal ============ */
function render(){
  renderTopbar();
  renderMain();
  renderModal();
}

function renderTopbar(){
  const bar = document.getElementById("topbar");
  if (state.view === "editor"){
    bar.innerHTML = `
      <div class="topbar-inner">
        <button class="back-btn" data-action="back-library">${ic.back}<span class="brand-text">${esc(state.story.title) || "Nueva historia"}</span></button>
        <nav class="tab-row">
          ${["portada","personajes","historia"].map((t) => `
            <button class="tab-btn ${state.tab===t?"active":""}" data-action="set-tab" data-tab="${t}">
              ${t==="portada"?ic.image:t==="personajes"?ic.users:ic.book} ${t[0].toUpperCase()+t.slice(1)}
            </button>`).join("")}
        </nav>
        <button class="pdf-btn" data-action="export-pdf">${ic.download} Descargar PDF</button>
        <span class="save-indicator">${ic.save} <span id="save-indicator-text">${state.saveState==="saving"?"Guardando…":"Guardado"}</span></span>
      </div>`;
  } else {
    bar.innerHTML = `
      <div class="topbar-inner">
        <div class="brand">${ic.sparkle}<span class="brand-text">Mis historias</span></div>
      </div>`;
  }
  bindTopbarEvents();
}

function renderMain(){
  const main = document.getElementById("main");
  if (state.view === "library"){
    main.innerHTML = renderLibraryHTML();
  } else {
    main.innerHTML = state.tab === "portada" ? renderPortadaHTML()
      : state.tab === "personajes" ? renderPersonajesHTML()
      : renderHistoriaHTML();
  }
  bindMainEvents();
  if (state.view === "editor" && state.tab === "personajes"){
    requestAnimationFrame(computeThreads);
  }
}

/* ---------- biblioteca ---------- */
function renderLibraryHTML(){
  const cards = state.stories.map((s) => `
    <div class="book-card">
      <div class="book-cover" data-action="open-story" data-id="${s.id}"
        style="background:${s.cover ? `url(${s.cover}) center/cover no-repeat` : (s.coverColor || COVER_SWATCHES[0])}">
        ${(!s.cover && !s.title) ? `<span style="color:rgba(34,27,46,.5)">${ic.book}</span>` : ""}
      </div>
      <div class="book-title" data-action="open-story" data-id="${s.id}">${esc(s.title) || "Sin título"}</div>
      ${state.confirmDeleteId === s.id ? `
        <div class="confirm-row">
          <button class="confirm-yes" data-action="delete-story" data-id="${s.id}">Eliminar</button>
          <button class="confirm-no" data-action="cancel-delete">Cancelar</button>
        </div>` : `
        <button class="delete-badge" data-action="confirm-delete" data-id="${s.id}">${ic.trash}</button>`}
    </div>`).join("");

  return `
    <div class="page-wrap">
      <div class="board-header"><h2 class="section-heading">Mis historias</h2></div>
      <div class="library-grid">
        <button class="add-book" data-action="create-story">${ic.plus}<span>Nueva historia</span></button>
        ${cards}
      </div>
      ${state.stories.length===0 ? `<p class="muted" style="margin-top:-8px">Aún no tienes historias. Crea la primera.</p>` : ""}
    </div>`;
}

/* ---------- portada ---------- */
function renderPortadaHTML(){
  const s = state.story;
  return `
    <div class="page-wrap">
      <div class="cover-layout">
        <div class="cover-art" id="cover-art" data-action="pick-cover"
          style="background:${s.cover ? `url(${s.cover}) center/cover no-repeat` : s.coverColor}">
          ${!s.cover ? `<div class="cover-art-empty">${ic.image}<span>Toca para subir portada</span></div>` : ""}
        </div>
        <input type="file" id="cover-file-input" accept="image/*" style="display:none" />

        ${!s.cover ? `
        <div class="swatch-row">
          ${COVER_SWATCHES.map((c) => `<button class="swatch" data-action="set-cover-color" data-color="${c}" style="background:${c}; box-shadow:${s.coverColor===c ? `0 0 0 2px #F3E9D2, 0 0 0 4px ${c}` : "none"}"></button>`).join("")}
        </div>` : ""}

        <div class="cover-fields">
          <label class="label">Nombre de la historia</label>
          <input class="title-input" id="field-title" data-field="title" value="${esc(s.title)}" placeholder="Escribe el título…" />
          <input class="tagline-input" id="field-tagline" data-field="tagline" value="${esc(s.tagline)}" placeholder="Una frase que la describa (opcional)" />
          <button class="primary-btn" data-action="go-historia">${ic.pen} Escribir la historia</button>
        </div>
      </div>

      <div class="card">
        <h3 class="card-title">Sinopsis</h3>
        <textarea class="synopsis-area" data-field="synopsis" placeholder="Resume de qué trata tu historia en unas líneas…">${esc(s.synopsis)}</textarea>
      </div>
    </div>`;
}

/* ---------- personajes (corcho) ---------- */
function renderPersonajesHTML(){
  const cards = state.characters.map((c) => `
    <button class="pin-card" data-action="edit-character" data-id="${c.id}">
      <span class="pin"></span>
      <div class="pin-photo" style="background:${c.photo ? `url(${c.photo}) center/cover no-repeat` : "#DDCBA0"}">
        ${!c.photo ? `<span style="color:#8A7647">${ic.users}</span>` : ""}
      </div>
      <div class="pin-name">${esc(c.name) || "Sin nombre"}</div>
      ${c.role ? `<div class="pin-role">${esc(c.role)}</div>` : ""}
    </button>`).join("");

  return `
    <div class="page-wrap">
      <div class="board-header">
        <h2 class="section-heading">Personajes</h2>
        <button class="primary-btn-sm" data-action="add-character">${ic.plus} Añadir personaje</button>
      </div>
      <div class="cork-board" id="cork-board">
        <svg class="thread-svg" id="thread-svg"></svg>
        ${state.characters.length===0 ? `<div class="empty-board">${ic.users}<p style="margin:6px 0 0">Aún no hay personajes. Añade el primero.</p></div>` : ""}
        <div class="board-grid" id="board-grid">${cards}</div>
      </div>
    </div>`;
}

function computeThreads(){
  const board = document.getElementById("cork-board");
  const svg = document.getElementById("thread-svg");
  if (!board || !svg) return;
  const boardRect = board.getBoundingClientRect();
  const seen = new Set();
  let markup = "";
  state.characters.forEach((c) => {
    (c.relations || []).forEach((rel) => {
      const key = [c.id, rel.targetId].sort().join("|") + "|" + rel.label;
      if (seen.has(key)) return;
      seen.add(key);
      const elA = document.querySelector(`[data-pin-id="${c.id}"]`) || document.querySelector(`[data-action="edit-character"][data-id="${c.id}"]`);
      const elB = document.querySelector(`[data-action="edit-character"][data-id="${rel.targetId}"]`);
      if (!elA || !elB) return;
      const a = elA.getBoundingClientRect(), b = elB.getBoundingClientRect();
      const x1=a.left+a.width/2-boardRect.left, y1=a.top+a.height/2-boardRect.top;
      const x2=b.left+b.width/2-boardRect.left, y2=b.top+b.height/2-boardRect.top;
      markup += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#A23B3B" stroke-width="1.6" opacity="0.75"/>
        <foreignObject x="${(x1+x2)/2-45}" y="${(y1+y2)/2-10}" width="90" height="20">
          <div xmlns="http://www.w3.org/1999/xhtml" class="thread-label">${esc(rel.label)}</div>
        </foreignObject>`;
    });
  });
  svg.innerHTML = markup;
}

/* ---------- historia ---------- */
function renderHistoriaHTML(){
  const s = state.story;
  const words = s.manuscript.trim() ? s.manuscript.trim().split(/\s+/).length : 0;
  return `
    <div class="page-wrap">
      <div class="board-header">
        <h2 class="section-heading">${esc(s.title) || "Historia sin título"}</h2>
        <span class="word-count" id="word-count">${words} palabras</span>
      </div>
      <div class="manuscript-card">
        <textarea class="manuscript-area" data-field="manuscript" placeholder="Érase una vez…">${esc(s.manuscript)}</textarea>
      </div>
    </div>`;
}

/* ---------- editor de personaje (modal) ---------- */
function renderModal(){
  const root = document.getElementById("modal-root");
  if (!state.editingChar){ root.innerHTML = ""; return; }
  const d = state.editingChar;
  const others = state.characters.filter((c) => c.id !== d.id);
  const isNew = state.isNewChar;

  root.innerHTML = `
    <div class="overlay" id="editor-overlay">
      <div class="editor-panel" id="editor-panel">
        <div class="editor-header">
          <button class="icon-btn" data-action="close-editor">${ic.back}</button>
          <span class="editor-title">${isNew ? "Nuevo personaje" : "Editar personaje"}</span>
          ${!isNew ? `<button class="icon-btn-danger" data-action="delete-character" data-id="${d.id}">${ic.trash}</button>` : ""}
        </div>
        <div class="editor-body">
          <div class="editor-top-row">
            <div class="editor-photo" id="char-photo" data-action="pick-photo" style="background:${d.photo ? `url(${d.photo}) center/cover no-repeat` : "#DDCBA0"}">
              ${!d.photo ? `<span style="color:#8A7647">${ic.image}</span>` : ""}
            </div>
            <input type="file" id="char-file-input" accept="image/*" style="display:none" />
            <div style="flex:1">
              <label class="label">Nombre</label>
              <input class="field-input" data-cfield="name" value="${esc(d.name)}" placeholder="Nombre del personaje" />
              <div class="two-col">
                <div style="flex:1"><label class="label">Edad</label><input class="field-input" data-cfield="age" value="${esc(d.age)}" placeholder="Edad" /></div>
                <div style="flex:2"><label class="label">Papel en la historia</label><input class="field-input" data-cfield="role" value="${esc(d.role)}" placeholder="Protagonista, villano…" /></div>
              </div>
            </div>
          </div>

          <label class="label">Personajes relacionados</label>
          <div class="relations-box">
            ${d.relations.length===0 ? `<p class="muted">Sin relaciones todavía.</p>` : ""}
            ${d.relations.map((rel) => `
              <div class="relation-row" data-relid="${rel.id}">
                <select class="field-select" data-rfield="targetId">
                  ${others.map((c) => `<option value="${c.id}" ${c.id===rel.targetId?"selected":""}>${esc(c.name)||"Sin nombre"}</option>`).join("")}
                </select>
                <input class="field-input" style="flex:1" list="relation-presets" data-rfield="label" value="${esc(rel.label)}" placeholder="Etiqueta (hermano, amigo…)" />
                <button class="icon-btn-danger" data-action="remove-relation" data-relid="${rel.id}">${ic.x}</button>
              </div>`).join("")}
            <datalist id="relation-presets">${RELATION_PRESETS.map((p) => `<option value="${p}"></option>`).join("")}</datalist>
            <button class="secondary-btn-sm" data-action="add-relation" ${others.length===0?"disabled":""}>${ic.plus} Añadir relación</button>
          </div>

          <label class="label">Qué parte aparece en la historia</label>
          <textarea class="textarea-sm" data-cfield="appearance" placeholder="En qué momentos o capítulos aparece…">${esc(d.appearance)}</textarea>

          <label class="label">Descripción</label>
          <textarea class="textarea-lg" data-cfield="description" placeholder="Personalidad, aspecto, historia personal…">${esc(d.description)}</textarea>
        </div>
        <div class="editor-footer">
          <button class="ghost-btn" data-action="close-editor">Cancelar</button>
          <button class="primary-btn" data-action="save-character" ${!d.name.trim() ? "disabled" : ""}>Guardar personaje</button>
        </div>
      </div>
    </div>`;
  bindModalEvents();
}

/* ============ eventos ============ */
function bindTopbarEvents(){
  document.getElementById("topbar").onclick = (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;
    if (action==="back-library") backToLibrary();
    else if (action==="set-tab") setTab(el.dataset.tab);
    else if (action==="export-pdf") exportPDF();
  };
}

function bindMainEvents(){
  const main = document.getElementById("main");

  main.onclick = (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;
    if (action==="open-story") openStory(el.dataset.id);
    else if (action==="create-story") createStory();
    else if (action==="confirm-delete"){ state.confirmDeleteId = el.dataset.id; renderMain(); }
    else if (action==="cancel-delete"){ state.confirmDeleteId = null; renderMain(); }
    else if (action==="delete-story") deleteStory(el.dataset.id);
    else if (action==="go-historia"){ state.tab = "historia"; render(); }
    else if (action==="pick-cover") document.getElementById("cover-file-input").click();
    else if (action==="set-cover-color"){ state.story.coverColor = el.dataset.color; scheduleSave(); renderMain(); }
    else if (action==="add-character") openCharacterEditor(emptyCharacter(), true);
    else if (action==="edit-character") openCharacterEditor(state.characters.find((c) => c.id===el.dataset.id), false);
  };

  main.oninput = (e) => {
    const t = e.target;
    if (!t.dataset.field) return;
    state.story[t.dataset.field] = t.value;
    if (t.dataset.field==="title"){
      const bt = document.querySelector(".brand-text");
      if (bt) bt.textContent = t.value || "Nueva historia";
      const h = document.querySelector("#main .section-heading");
      if (h && state.tab==="historia") h.textContent = t.value || "Historia sin título";
    }
    if (t.dataset.field==="manuscript"){
      const wc = document.getElementById("word-count");
      if (wc){ const words = t.value.trim() ? t.value.trim().split(/\s+/).length : 0; wc.textContent = words + " palabras"; }
    }
    scheduleSave();
  };

  const coverInput = document.getElementById("cover-file-input");
  if (coverInput){
    coverInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { state.story.cover = reader.result; scheduleSave(); renderMain(); };
      reader.readAsDataURL(file);
    };
  }
}

function bindModalEvents(){
  const overlay = document.getElementById("editor-overlay");
  if (!overlay) return;

  overlay.onclick = (e) => { if (e.target === overlay) closeCharacterEditor(); };

  overlay.querySelector(".editor-panel").onclick = (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;
    if (action==="close-editor") closeCharacterEditor();
    else if (action==="save-character") saveCharacterFromEditor();
    else if (action==="delete-character") deleteCharacterFromEditor(el.dataset.id);
    else if (action==="pick-photo") document.getElementById("char-file-input").click();
    else if (action==="add-relation"){
      const others = state.characters.filter((c) => c.id !== state.editingChar.id);
      if (others.length===0) return;
      state.editingChar.relations.push({ id: uid(), targetId: others[0].id, label: RELATION_PRESETS[0] });
      renderModal();
    }
    else if (action==="remove-relation"){
      state.editingChar.relations = state.editingChar.relations.filter((r) => r.id !== el.dataset.relid);
      renderModal();
    }
  };

  overlay.querySelector(".editor-body").oninput = (e) => {
    const t = e.target;
    if (t.dataset.cfield){
      state.editingChar[t.dataset.cfield] = t.value;
      if (t.dataset.cfield==="name"){
        const saveBtn = overlay.querySelector('[data-action="save-character"]');
        if (saveBtn) saveBtn.disabled = !t.value.trim();
      }
      return;
    }
    const row = t.closest("[data-relid]");
    if (row && t.dataset.rfield){
      const rel = state.editingChar.relations.find((r) => r.id === row.dataset.relid);
      if (rel) rel[t.dataset.rfield] = t.value;
    }
  };

  const charFile = document.getElementById("char-file-input");
  if (charFile){
    charFile.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { state.editingChar.photo = reader.result; renderModal(); };
      reader.readAsDataURL(file);
    };
  }
}

/* ============ exportar a PDF ============ */
function imgFormat(dataUrl){
  if (!dataUrl) return "JPEG";
  return dataUrl.indexOf("data:image/png") === 0 ? "PNG" : "JPEG";
}

function exportPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"pt", format:"a4" });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 48;
  let y = margin;
  const s = state.story;

  const addPageIfNeeded = (needed) => { if (y + needed > pageH - margin){ doc.addPage(); y = margin; } };

  // Portada
  doc.setFont("times","bold"); doc.setFontSize(26);
  doc.text(s.title || "Historia sin título", margin, y); y += 30;
  if (s.tagline){ doc.setFont("times","italic"); doc.setFontSize(13); doc.text(s.tagline, margin, y); y += 22; }
  if (s.cover){
    try { doc.addImage(s.cover, imgFormat(s.cover), margin, y, 160, 210); } catch(e){}
    y += 226;
  } else {
    doc.setFillColor(s.coverColor || "#D3A625");
    doc.rect(margin, y, 160, 210, "F");
    y += 226;
  }

  addPageIfNeeded(40);
  doc.setFont("times","bold"); doc.setFontSize(15); doc.text("Sinopsis", margin, y); y += 20;
  doc.setFont("times","normal"); doc.setFontSize(11);
  const synLines = doc.splitTextToSize(s.synopsis || "Sin sinopsis todavía.", pageW - margin*2);
  synLines.forEach((line) => { addPageIfNeeded(16); doc.text(line, margin, y); y += 15; });

  // Personajes
  doc.addPage(); y = margin;
  doc.setFont("times","bold"); doc.setFontSize(19); doc.text("Personajes", margin, y); y += 28;

  if (state.characters.length === 0){
    doc.setFont("times","italic"); doc.setFontSize(11); doc.text("Aún no se han creado personajes.", margin, y); y += 18;
  }

  state.characters.forEach((c) => {
    addPageIfNeeded(70);
    doc.setFont("times","bold"); doc.setFontSize(13.5); doc.text(c.name || "Sin nombre", margin, y); y += 17;
    const meta = [c.age && ("Edad: "+c.age), c.role && ("Papel: "+c.role)].filter(Boolean).join("   ·   ");
    if (meta){ doc.setFont("times","italic"); doc.setFontSize(10); doc.text(meta, margin, y); y += 15; }
    if (c.relations && c.relations.length){
      const relText = "Relaciones: " + c.relations.map((r) => {
        const target = state.characters.find((ch) => ch.id === r.targetId);
        return r.label + " de " + (target ? target.name : "?");
      }).join(", ");
      doc.setFont("times","normal"); doc.setFontSize(10);
      doc.splitTextToSize(relText, pageW - margin*2).forEach((line) => { addPageIfNeeded(14); doc.text(line, margin, y); y += 13; });
    }
    if (c.appearance){
      doc.setFont("times","normal"); doc.setFontSize(10.5);
      doc.splitTextToSize("Aparición: " + c.appearance, pageW - margin*2).forEach((line) => { addPageIfNeeded(14); doc.text(line, margin, y); y += 13; });
    }
    if (c.description){
      doc.splitTextToSize(c.description, pageW - margin*2).forEach((line) => { addPageIfNeeded(14); doc.text(line, margin, y); y += 13; });
    }
    y += 14;
  });

  // Manuscrito
  doc.addPage(); y = margin;
  doc.setFont("times","bold"); doc.setFontSize(19); doc.text("Historia", margin, y); y += 28;
  doc.setFont("times","normal"); doc.setFontSize(11);
  const manLines = doc.splitTextToSize(s.manuscript || "Aún no has escrito nada.", pageW - margin*2);
  manLines.forEach((line) => { addPageIfNeeded(16); doc.text(line, margin, y); y += 15; });

  const filename = (s.title || "historia").toLowerCase().replace(/[^a-z0-9]+/gi, "-").replace(/^-+|-+$/g,"") || "historia";
  doc.save(filename + ".pdf");
}

/* ============ inicio ============ */
render();
